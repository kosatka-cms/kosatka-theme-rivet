        <h2>The workshops</h2>
        <ul>
        <li><strong>Cutting.</strong> Plasma and laser cutting of sheets up to 40 mm, band saws for sections.</li>
        <li><strong>Welding.</strong> Automatic and manual welding, certified welders.</li>
        <li><strong>Painting.</strong> Shot blasting and a paint line for 600 t a month.</li>
        <li><strong>Quality.</strong> A laboratory checking the welds and the coats.</li>
