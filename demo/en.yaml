# A block's weight orders it in its region (0 - its place in this list,
# times ten).
blocks:
  # The top bar: the address on the left, the hours and the phone on the
  # right; the header's button goes to the request at the page's end.
  - region: top_bar
    weight: 1
    title: Address and phone
    body: <p>14 Foundry Road, Northfield</p><p>Mon-Fri 8:00-18:00 &middot; <a href="tel:+15550100000">+1 555 010 0000</a></p>
  - region: header_actions
    weight: 1
    title: Request a price
    body: <p><a href="#r-cta">Request a price</a></p>
  # The front page: the slider, the figures, the bands.
  - {region: hero, visibility: homepage, weight: 1, view: slides, title: Slides}
  - region: highlight
    visibility: homepage
    weight: 1
    title: Figures
    body: <ul><li><strong>1,200 t</strong> of steel structures a month</li><li><strong>18,000 m²</strong> of workshops</li><li><strong>450+</strong> projects delivered</li><li><strong>32</strong> regions supplied</li></ul>
  - region: bands
    visibility: homepage
    weight: 1
    title: Production
    show_title: true
    body: |
      <p><img src="/static/themes/rivet/images/workshop.webp" alt="The assembly hall" width="1440" height="810"></p>
      <p>18,000 m² of workshops on one site: cutting, welding, painting and a laboratory for the welds - from a sheet of steel to a part ready to erect.</p>
      <ul><li>Plasma and laser cutting up to 40 mm</li><li>Automatic welding, certified welders</li><li>A paint line for 600 t a month</li><li>Our own trucks and erection crews</li></ul>
      <p><a href="/production">About the production &rarr;</a></p>
  - {region: bands, visibility: homepage, weight: 10, view: projects_home, title: Projects, show_title: true}
  - region: bands
    visibility: homepage
    weight: 20
    title: Certificates and approvals
    show_title: true
    body: <p><a href="/documents">ISO 9001</a> <a href="/documents">EN 1090-2, EXC3</a> <a href="/documents">ISO 3834-2</a> <a href="/documents">Fire safety</a></p>
  # Every page ends with the request: a text, then the form (the forms
  # module's block, modules.forms.block).
  - region: cta
    weight: 1
    title: Get a quote
    show_title: true
    body: |
      <p>Send us a drawing or describe the task - an engineer gets back to you within a working day.</p>
      <p><a href="tel:+15550100000">+1 555 010 0000</a> &middot; <a href="mailto:sales@example.com">sales@example.com</a></p>
  # A project's page: an offer beside the text.
  - region: sidebar
    types: [project]
    weight: 1
    title: A similar project?
    show_title: true
    body: <p>Send us the task - we'll estimate the cost and the timeline.</p><p><a href="#r-cta">Send a request</a></p>
  # The footer: about, the links, the contacts.
  - region: footer
    weight: -10
    title: Brackwell Steel
    show_title: true
    body: <p>Steel structures for industry and cities - design, making and erection since 1998.</p>
  - region: footer
    weight: 20
    title: Contacts
    show_title: true
    body: <p><a href="tel:+15550100000">+1 555 010 0000</a><br><a href="mailto:sales@example.com">sales@example.com</a><br>14 Foundry Road, Northfield</p>

