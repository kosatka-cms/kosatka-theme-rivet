# The rivet theme's demo site (app install -demo-set rivet): a plant
# making steel structures - its products with their pictures and
# figures, its projects, its production and documents, contacts and a
# request form with a drawing, the front page made of the theme's bands
# (a slider in the hero, figures in the accent, products, the
# production, projects, certificates, the request). Everything here is
# ordinary content and blocks, edited in the admin. The pictures, the
# products' technical sheets and the certificates are the theme's own
# (demo/images, demo/docs), copied into the site's files on install; the
# production band's picture is in the theme's static images.
site:
  slogan: Steel structures since 1998
  front_page_view: products_home
  main_menu: main
  footer_menu: footer

users:
  - buyer_alex
  - buyer_nina

image_styles:
  - {name: rivet_card, label: Card, width: 720, height: 450, mode: fill, anchor: focal, hidpi: true}
  - {name: rivet_photo, label: Product photo, width: 1200, height: 800, mode: fill, anchor: focal, hidpi: true}
  - {name: rivet_wide, label: Wide, width: 1600, height: 900, mode: fill, anchor: focal, hidpi: true}
  - {name: rivet_tile, label: Tile, width: 800, height: 600, mode: fill, anchor: focal, hidpi: true}

vocabularies:
  - name: categories
    label: Product categories
    path: categories
    terms: [Frames, Hangars, Tanks, Masts, Stairs and platforms, Custom]
  - name: purposes
    label: Purposes
    path: purposes
    terms: [Industrial, Civil, Energy, Logistics]
  - name: locations
    label: Locations
    path: locations
    terms: [Northfield, Eastport, Riverton, Lakeside, Westbrook, Hillcrest]
  - name: slide_labels
    label: Slide labels
    path: slide-labels
    terms: [Own production since 1998, "Project: Northfield, 2025", New in the plant]

field_storages:
  - {name: field_photos, type: image, multiple: true}
  - {name: field_category, type: taxonomy, vocabulary: categories}
  - {name: field_purpose, type: taxonomy, vocabulary: purposes, multiple: true}
  - {name: field_size, type: text}
  - {name: field_steel, type: text}
  - {name: field_finish, type: text}
  - {name: field_lead_time, type: text}
  - {name: field_documents, type: file, multiple: true}
  - {name: field_location, type: taxonomy, vocabulary: locations}
  - {name: field_area, type: text}
  - {name: field_tonnage, type: text}
  - {name: field_timeline, type: text}
  - {name: field_client, type: text}
  - {name: field_products, type: reference, target: [product], multiple: true}
  - {name: field_site_photos, type: image, multiple: true}
  - {name: field_slide_label, type: taxonomy, vocabulary: slide_labels}
  - {name: field_files, type: file, multiple: true}

content_types:
  - name: product
    label: Product
    description: What the plant makes - its pictures, its figures, its documents.
    path: products
    comments: hidden
    fields:
      - {storage: field_photos, label: Pictures, show_on_detail: true, detail_image_style: rivet_photo, list_image_style: rivet_card, sort_order: 0, display_order: 0}
      - {storage: field_category, label: Category, show_on_detail: true, sort_order: 10, display_order: 1}
      - {storage: field_purpose, label: Purpose, show_on_detail: true, show_label: true, sort_order: 20, display_order: 2}
      - {storage: field_size, label: Size, show_on_detail: true, show_label: true, sort_order: 30, display_order: 3}
      - {storage: field_steel, label: Steel, show_on_detail: true, show_label: true, sort_order: 40, display_order: 4}
      - {storage: field_finish, label: Finish, show_on_detail: true, show_label: true, sort_order: 50, display_order: 5}
      - {storage: field_lead_time, label: Lead time, show_on_detail: true, show_label: true, sort_order: 60, display_order: 6}
      - {storage: field_documents, label: Documents, show_on_detail: true, show_label: true, sort_order: 80, display_order: 20}
      - {storage: field_body, label: Description, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 70, display_order: 10}
  - name: project
    label: Project
    description: A structure the plant made and erected - the task, the work, the figures.
    path: projects
    comments: hidden
    fields:
      - {storage: field_image, label: Cover, show_on_detail: true, detail_image_style: rivet_wide, list_image_style: rivet_tile, sort_order: 0, display_order: 0}
      - {storage: field_location, label: Location, show_on_detail: true, sort_order: 10, display_order: 1}
      - {storage: field_area, label: Area, show_on_detail: true, show_label: true, sort_order: 20, display_order: 2}
      - {storage: field_tonnage, label: Steel, show_on_detail: true, show_label: true, sort_order: 30, display_order: 3}
      - {storage: field_timeline, label: Timeline, show_on_detail: true, show_label: true, sort_order: 40, display_order: 4}
      - {storage: field_client, label: Client, show_on_detail: true, show_label: true, sort_order: 50, display_order: 5}
      - {storage: field_body, label: Description, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 60, display_order: 10}
      - {storage: field_site_photos, label: From the site, show_on_detail: true, detail_image_style: rivet_card, list_image_style: rivet_card, sort_order: 70, display_order: 20}
      - {storage: field_products, label: Products used, widget: autocomplete, sort_order: 80, display_order: 30}
  - name: file_page
    label: Page with files
    description: A page with files to download under its text - documents, a price list, company details.
    path: pages
    comments: hidden
    fields:
      - {storage: field_body, label: Text, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 0, display_order: 0}
      - {storage: field_files, label: Files, show_on_detail: true, show_label: false, sort_order: 10, display_order: 10}
  - name: slide
    label: Slide
    description: A slide of the front page's slider - its picture, its label, its title and text with buttons; its tab shows the title.
    path: slides
    comments: hidden
    fields:
      - {storage: field_image, label: Picture, show_on_detail: true, detail_image_style: rivet_wide, list_image_style: rivet_wide, sort_order: 0, display_order: 0}
      - {storage: field_slide_label, label: Label, show_on_detail: true, sort_order: 10, display_order: 1}
      - {storage: field_body, label: Text, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 30, display_order: 10}

